[tool.poetry]
name = "mail-trace-backend"
version = "0.1.0"
description = "AI agent that reads Gmail and tracks job applications"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"

# Web framework
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
python-dotenv = "^1.0.0"
pydantic = "^2.7.0"
pydantic-settings = "^2.3.0"

# LangGraph / LangChain
langgraph = "^0.2.0"
langchain = "^0.3.0"
langchain-openai = "^0.2.0"          # swap for langchain-anthropic / langchain-google-genai as needed
langchain-community = "^0.3.0"

# Gmail
google-auth = "^2.29.0"
google-auth-oauthlib = "^1.2.0"
google-auth-httplib2 = "^0.2.0"
google-api-python-client = "^2.131.0"

# Database
sqlalchemy = "^2.0.0"
sqlmodel = "^0.0.22"
alembic = "^1.13.0"
psycopg2-binary = "^2.9.9"   # PostgreSQL driver
# asyncpg = "^0.29.0"   # uncomment for PostgreSQL async driver

# Utilities
httpx = "^0.27.0"
tenacity = "^8.3.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
httpx = "^0.27.0"
ruff = "^0.4.0"
mypy = "^1.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.basedpyright]
reportMissingTypeStubs = "none"
# LangChain/LangGraph ship loosely-typed stubs (heavy `Any`/`Unknown`), so the
# "unknown" family is noise here. Their builder methods (add_node/add_edge/...)
# return `self` for chaining, so discarding those results is intentional.
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportUnusedCallResult = "none"
